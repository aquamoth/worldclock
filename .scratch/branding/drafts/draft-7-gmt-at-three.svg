<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Draft 7: GMT at Three — fluted (coin-edge) bezel, champagne gold on deep
       green lacquer, cream GMT subdial at 3 o'clock. The "expensive" tritone. -->
  <circle cx="512" cy="512" r="512" fill="#0B2A20"/>
  <!-- fluted bezel: 60 flutes between two bounding rings -->
  <circle cx="512" cy="512" r="308" fill="none" stroke="#D4B678" stroke-width="5"/>
  <circle cx="512" cy="512" r="296" fill="none" stroke="#D4B678" stroke-width="20"
          pathLength="120" stroke-dasharray="1 1"/>
  <circle cx="512" cy="512" r="284" fill="none" stroke="#D4B678" stroke-width="5"/>
  <g fill="#D4B678">
    <!-- baton indices; double at 12; 3 o'clock ceded to the GMT subdial -->
    <rect x="495" y="242" width="12" height="44"/>
    <rect x="517" y="242" width="12" height="44"/>
    <rect x="504" y="242" width="16" height="44" transform="rotate(30 512 512)"/>
    <rect x="504" y="242" width="16" height="44" transform="rotate(60 512 512)"/>
    <rect x="504" y="242" width="16" height="44" transform="rotate(120 512 512)"/>
    <rect x="504" y="242" width="16" height="44" transform="rotate(150 512 512)"/>
    <rect x="504" y="242" width="16" height="44" transform="rotate(180 512 512)"/>
    <rect x="504" y="242" width="16" height="44" transform="rotate(210 512 512)"/>
    <rect x="504" y="242" width="16" height="44" transform="rotate(240 512 512)"/>
    <rect x="504" y="242" width="16" height="44" transform="rotate(270 512 512)"/>
    <rect x="504" y="242" width="16" height="44" transform="rotate(300 512 512)"/>
    <rect x="504" y="242" width="16" height="44" transform="rotate(330 512 512)"/>
  </g>
  <!-- GMT subdial at 3: cream lacquer, gold ring, green hand -->
  <circle cx="672" cy="512" r="84" fill="#EFE3C8" stroke="#D4B678" stroke-width="10"/>
  <circle cx="672" cy="512" r="64" fill="none" stroke="#0B2A20" stroke-width="10"
          pathLength="12" stroke-dasharray="0.15 0.85"/>
  <line x1="672" y1="512" x2="672" y2="458" stroke="#0B2A20" stroke-width="12"
        stroke-linecap="round" transform="rotate(300 672 512)"/>
  <circle cx="672" cy="512" r="9" fill="#0B2A20"/>
  <!-- dauphine hands, 10:08 -->
  <g fill="#D4B678">
    <path d="M 512 336 L 537 486 L 512 514 L 487 486 Z" transform="rotate(304 512 512)"/>
    <path d="M 512 258 L 531 478 L 512 512 L 493 478 Z" transform="rotate(52 512 512)"/>
    <circle cx="512" cy="512" r="20"/>
  </g>
  <circle cx="512" cy="512" r="8" fill="#0B2A20"/>
</svg>
