  <g fill="#1B1730">
    <circle cx="512" cy="512" r="300" fill="none" stroke="#1B1730" stroke-width="26"/>
    <rect x="501" y="234" width="22" height="52"/>
    <!-- subdial -->
    <circle cx="512" cy="664" r="92" fill="none" stroke="#1B1730" stroke-width="18"/>
    <line x1="512" y1="664" x2="512" y2="600" stroke="#1B1730" stroke-width="18"
          stroke-linecap="round" transform="rotate(210 512 664)"/>
    <circle cx="512" cy="664" r="13"/>
    <!-- bold dauphine hands, 10:08 -->
    <path d="M 512 330 L 546 480 L 512 516 L 478 480 Z" transform="rotate(304 512 512)"/>
    <path d="M 512 254 L 538 474 L 512 512 L 486 474 Z" transform="rotate(52 512 512)"/>
