<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Draft 9: Fluted Roman — cream enamel dial, gold fluted bezel, authored
       XII letterform at 12, dot indices, small-seconds subdial at 6. Tritone. -->
  <circle cx="512" cy="512" r="512" fill="#F2ECDF"/>
  <!-- fluted bezel -->
  <circle cx="512" cy="512" r="304" fill="none" stroke="#26211B" stroke-width="6"/>
  <circle cx="512" cy="512" r="290" fill="none" stroke="#AE8A3B" stroke-width="16"
          pathLength="120" stroke-dasharray="1 1"/>
  <!-- XII authored as strokes -->
  <g stroke="#26211B" stroke-width="13" stroke-linecap="round">
    <line x1="476" y1="240" x2="512" y2="296"/>
    <line x1="512" y1="240" x2="476" y2="296"/>
    <line x1="528" y1="240" x2="528" y2="296"/>
    <line x1="548" y1="240" x2="548" y2="296"/>
  </g>
  <!-- dot indices at the remaining hours (12 and 6 ceded) -->
  <g fill="#26211B">
    <circle cx="637" cy="295.5" r="9"/>
    <circle cx="726.8" cy="387" r="9"/>
    <circle cx="762" cy="512" r="9"/>
    <circle cx="726.8" cy="637" r="9"/>
    <circle cx="637" cy="728.5" r="9"/>
    <circle cx="387" cy="728.5" r="9"/>
    <circle cx="297.2" cy="637" r="9"/>
    <circle cx="262" cy="512" r="9"/>
    <circle cx="297.2" cy="387" r="9"/>
    <circle cx="387" cy="295.5" r="9"/>
  </g>
  <!-- small-seconds subdial at 6 -->
  <circle cx="512" cy="668" r="86" fill="none" stroke="#AE8A3B" stroke-width="9"/>
  <circle cx="512" cy="668" r="64" fill="none" stroke="#26211B" stroke-width="3"/>
  <line x1="512" y1="668" x2="512" y2="610" stroke="#26211B" stroke-width="11"
        stroke-linecap="round" transform="rotate(240 512 668)"/>
  <circle cx="512" cy="668" r="9" fill="#26211B"/>
  <!-- dauphine hands, 10:08 -->
  <g fill="#26211B">
    <path d="M 512 336 L 537 486 L 512 514 L 487 486 Z" transform="rotate(304 512 512)"/>
    <path d="M 512 258 L 531 478 L 512 512 L 493 478 Z" transform="rotate(52 512 512)"/>
  </g>
  <circle cx="512" cy="512" r="18" fill="#AE8A3B"/>
</svg>
